<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- =========================
     WEBSITE TITLE
========================= -->
<title>My Video Site</title>

<style>

/* =========================
   BASIC RESET
========================= */
*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f4f7;
}


/* =========================
   TOP BAR
========================= */
.topbar{
    height:60px;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 15px;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    z-index:1000;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
}

/* MENU BUTTON */
.menu-button{
    width:45px;
    height:45px;
    border:none;
    background:#f1f1f1;
    border-radius:12px;
    font-size:25px;
    cursor:pointer;
    transition:.2s;
}

.menu-button:hover{
    transform:scale(1.08);
}

/* WEBSITE NAME */
.site-name{
    font-size:20px;
    font-weight:bold;
    color:#6c4cff;
}

/* ACCOUNT BUTTON */
.account{
    width:45px;
    height:45px;
    border-radius:50%;
    background:#6c4cff;
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    transition:.2s;
}

.account:hover{
    transform:scale(1.08);
}


/* =========================
   ACCOUNT BOX
========================= */
.account-box{
    position:fixed;
    top:70px;
    right:15px;
    width:220px;
    background:white;
    padding:20px;
    border-radius:15px;
    box-shadow:0 5px 20px rgba(0,0,0,.2);
    display:none;
    z-index:3000;
    animation:accountOpen .2s ease;
}

.account-box.active{
    display:block;
}

.account-box h3{
    margin-top:0;
    text-align:center;
}

.account-box input{
    width:100%;
    padding:11px;
    margin-bottom:10px;
    border:1px solid #ddd;
    border-radius:8px;
    outline:none;
}

.account-box input:focus{
    border-color:#6c4cff;
}

.login-button,
.signup-button{
    width:100%;
    padding:11px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    margin-top:5px;
}

.login-button{
    background:#6c4cff;
    color:white;
}

.signup-button{
    background:#eee;
    color:#333;
}

@keyframes accountOpen{
    from{
        opacity:0;
        transform:translateY(-10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}


/* =========================
   SIDE MENU
========================= */
.side-menu{
    position:fixed;
    top:0;
    left:-280px;
    width:280px;
    height:100%;
    background:white;
    z-index:2000;
    box-shadow:5px 0 20px rgba(0,0,0,.2);
    transition:.3s;
    padding-top:75px;
}

.side-menu.active{
    left:0;
}

.menu-title{
    padding:15px 20px;
    font-size:22px;
    font-weight:bold;
}

.menu-item{
    display:block;
    margin:5px 12px;
    padding:15px 18px;
    text-decoration:none;
    color:#222;
    font-size:18px;
    border-radius:12px;
    transition:.2s;
}

.menu-item:hover{
    background:#f1efff;
    color:#6c4cff;
    transform:translateX(5px);
}

.close-btn{
    position:absolute;
    top:15px;
    right:15px;
    border:none;
    background:#eee;
    width:40px;
    height:40px;
    border-radius:50%;
    font-size:20px;
    cursor:pointer;
}

.overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    z-index:1500;
    display:none;
}

.overlay.active{
    display:block;
}


/* =========================
   MAIN CONTENT
========================= */
main{
    padding:85px 15px 30px;
    max-width:900px;
    margin:auto;
}


/* =========================
   HERO
========================= */
.hero{
    background:linear-gradient(135deg,#6c4cff,#9c7cff);
    color:white;
    border-radius:25px;
    padding:45px 25px;
    text-align:center;
    box-shadow:0 8px 20px rgba(0,0,0,.15);
    overflow:hidden;
}

.hero h1{
    margin:0 0 10px;
    font-size:32px;
}

.hero p{
    margin:0;
    font-size:17px;
    opacity:.9;
}


/* =========================
   SECTION TITLE
========================= */
.section-title{
    margin-top:30px;
    font-size:25px;
}


/* =========================
   VIDEO FEED
========================= */
.video-feed{
    display:flex;
    flex-direction:column;
    gap:15px;
}


/* =========================
   FULL VIDEO CARD
========================= */
.video-card{
    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 4px 12px rgba(0,0,0,.15);
}

.video-card video{
    width:100%;
    display:block;
    background:#000;
    max-height:500px;
}


/* =========================
   SHORT SECTION
========================= */
.short-section{
    background:#111;
    border-radius:18px;
    padding:10px;
    overflow:hidden;
}

.short-heading{
    color:white;
    font-size:18px;
    font-weight:bold;
    margin-bottom:10px;
}


/* =========================
   SHORT HORIZONTAL ROW
========================= */
.tiktok-line{
    display:flex;
    gap:12px;
    overflow-x:auto;
    scrollbar-width:none;
}

.tiktok-line::-webkit-scrollbar{
    display:none;
}


/* =========================
   SHORT CARD
========================= */
.tiktok-card{
    min-width:145px;
    width:145px;
    height:210px;
    background:#000;
    border-radius:15px;
    overflow:hidden;
    flex-shrink:0;
    cursor:pointer;
    position:relative;
}

.tiktok-card video{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    background:#000;
    pointer-events:none;
}

.tiktok-card iframe{
    width:100%;
    height:100%;
    border:0;
    display:block;
    pointer-events:none;
}


/* =========================
   FULLSCREEN SHORT VIEWER
========================= */
.short-viewer{
    position:fixed;
    inset:0;
    background:#000;
    z-index:5000;
    display:none;
    overflow:hidden;
}

.short-viewer.active{
    display:block;
}


/* =========================
   SHORT CLOSE BUTTON
========================= */
.short-close{
    position:fixed;
    top:15px;
    right:15px;
    z-index:7000;
    width:44px;
    height:44px;
    border:none;
    border-radius:50%;
    background:rgba(0,0,0,.55);
    color:white;
    font-size:22px;
    cursor:pointer;
}


/* =========================
   SOUND BUTTON
========================= */
.sound-button{
    position:fixed;
    right:15px;
    bottom:25px;
    z-index:7000;
    width:48px;
    height:48px;
    border:none;
    border-radius:50%;
    background:rgba(0,0,0,.55);
    color:white;
    font-size:22px;
    cursor:pointer;
}


/* =========================
   TIKTOK STYLE SCROLL
========================= */
.short-feed{
    width:100%;
    height:100%;
    overflow-y:auto;
    overflow-x:hidden;
    scroll-snap-type:y mandatory;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior-y:contain;
}

.short-item{
    width:100%;
    height:100vh;
    min-height:100vh;
    position:relative;
    background:#000;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    scroll-snap-align:start;
    scroll-snap-stop:always;
}


/* =========================
   MP4 SHORT PLAYER
========================= */
.short-item video{
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
    background:#000;
}


/* =========================
   JUMPSHARE PLAYER
========================= */
.short-item iframe{
    width:100%;
    height:100%;
    border:0;
    display:block;
}


/* =========================
   POST CARDS
========================= */
.posts{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}

.post{
    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 4px 12px rgba(0,0,0,.2);
}

.post-image{
    height:150px;
    background:linear-gradient(135deg,#ddd,#aaa);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:50px;
}

.post-content{
    padding:15px;
}

.post h2{
    margin:0 0 8px;
}

.post p{
    margin:0;
    color:#666;
}


/* =========================
   MOBILE
========================= */
@media(max-width:600px){

    .posts{
        grid-template-columns:1fr;
    }

    .hero h1{
        font-size:27px;
    }

    .tiktok-card{
        min-width:135px;
        width:135px;
        height:195px;
    }

}

</style>
</head>


<body>


<!-- =========================
     TOP BAR
========================= -->

<header class="topbar">

    <!-- MENU BUTTON -->
    <button class="menu-button">☰</button>

    <!-- WEBSITE NAME -->
    <div class="site-name">
        🌿 My Video Site
    </div>

    <!-- ACCOUNT BUTTON -->
    <div class="account">
        👤
    </div>

</header>


<!-- =========================
     ACCOUNT LOGIN BOX
========================= -->

<div class="account-box">

    <h3>👤 Account</h3>

    <!-- EMAIL -->
    <input
        type="email"
        placeholder="Email">

    <!-- PASSWORD -->
    <input
        type="password"
        placeholder="Password">

    <!-- LOGIN -->
    <button class="login-button">
        Login
    </button>

    <!-- SIGN UP -->
    <button class="signup-button">
        Sign Up
    </button>

</div>


<!-- =========================
     SIDE MENU
========================= -->

<div class="side-menu">

    <!-- CLOSE MENU -->
    <button class="close-btn">
        ✕
    </button>

    <!-- MENU TITLE -->
    <div class="menu-title">
        📱 Menu
    </div>

    <!-- HOME -->
    <a
        href="#home"
        class="menu-item">
        🏠 Home
    </a>

    <!-- SHORT -->
    <a
        href="#short"
        class="menu-item">
        🎵 TikTok Short
    </a>

    <!-- FULL VIDEO -->
    <a
        href="#fullvideo"
        class="menu-item">
        🎬 Full Video
    </a>

</div>


<!-- DARK OVERLAY -->
<div class="overlay"></div>


<!-- =========================
     MAIN WEBSITE
========================= -->

<main id="home">


<!-- =========================
     HERO
========================= -->

<section class="hero">

    <h1>
        Welcome to my website 👋
    </h1>

    <p>
        Watch short & full video
    </p>

</section>


<!-- =========================
     VIDEO FEED
========================= -->

<h2 class="section-title">
    🎬 Videos
</h2>

<div
    id="videoFeed"
    class="video-feed">
</div>


<!-- =========================
     SHORT SECTION
========================= -->

<h2
    id="short"
    class="section-title">

    🎵 TikTok Short

</h2>

<div class="posts">

    <div class="post">

        <div class="post-image">
            🎵
        </div>

        <div class="post-content">

            <h2>
                Short Videos
            </h2>

            <p>
                Tap a Short to watch
            </p>

        </div>

    </div>

</div>


<!-- =========================
     FULL VIDEO SECTION
========================= -->

<h2
    id="fullvideo"
    class="section-title">

    🎬 Full Video

</h2>

<div class="posts">

    <div class="post">

        <div class="post-image">
            🎬
        </div>

        <div class="post-content">

            <h2>
                Full Videos
            </h2>

            <p>
                Full videos appear above
            </p>

        </div>

    </div>


    <div class="post">

        <div class="post-image">
            🎬
        </div>

        <div class="post-content">

            <h2>
                More Videos
            </h2>

            <p>
                Full videos appear above
            </p>

        </div>

    </div>

</div>

</main>


<!-- =========================
     SHORT FULLSCREEN VIEWER
========================= -->

<div
    id="shortViewer"
    class="short-viewer">


    <!-- CLOSE -->
    <button
        id="shortClose"
        class="short-close">

        ✕

    </button>


    <!-- VOLUME -->
    <button
        id="soundButton"
        class="sound-button">

        🔇

    </button>


    <!-- SHORT FEED -->
    <div
        id="shortFeed"
        class="short-feed">
    </div>

</div>


<script>


/* =========================
   MENU JAVASCRIPT
========================= */

const menuButton =
document.querySelector(".menu-button");

const sideMenu =
document.querySelector(".side-menu");

const closeButton =
document.querySelector(".close-btn");

const overlay =
document.querySelector(".overlay");


/* OPEN MENU */
menuButton.onclick = function(){

    sideMenu.classList.add("active");

    overlay.classList.add("active");

};


/* CLOSE MENU */
closeButton.onclick = function(){

    sideMenu.classList.remove("active");

    overlay.classList.remove("active");

};


/* CLOSE WITH OVERLAY */
overlay.onclick = function(){

    sideMenu.classList.remove("active");

    overlay.classList.remove("active");

};


/* =========================
   ACCOUNT JAVASCRIPT
========================= */

const account =
document.querySelector(".account");

const accountBox =
document.querySelector(".account-box");


/* OPEN ACCOUNT */
account.onclick = function(){

    accountBox.classList.toggle("active");

};


/* CLOSE ACCOUNT OUTSIDE */
document.addEventListener(
    "click",
    function(event){

        if(
            !account.contains(event.target) &&
            !accountBox.contains(event.target)
        ){

            accountBox.classList.remove(
                "active"
            );

        }

    }
);


/* =========================
   🎬 FULL VIDEO LIST
========================= */

const fullVideos = [

    "https://jumpshare.com/embed/YkjIOaRPiSVYTlWqdOhg",
    
    "full2.mp4",
    "full3.mp4",
    "full4.mp4",
    "full5.mp4",
    "full6.mp4",
    "full7.mp4",
    "full8.mp4",
    "full9.mp4",
    "full10.mp4",
    "full11.mp4"

];


/* =========================
   🎵 JUMPSHARE SHORT LIST
========================= */

const jumpshareShorts = [

    "https://jumpshare.com/embed/iS3VghaMGO6tASQ4MOQA",

    "https://jumpshare.com/embed/XZ8ssnbfpFFufPut2WmQ",

    "https://jumpshare.com/embed/FtwigrQzXck9vJkwqIsA",

    "https://jumpshare.com/embed/94SRSa1glVD5mcqghuiZ",

    "https://jumpshare.com/embed/SIwI3swoOz8pDlupdfxf",

    "https://jumpshare.com/embed/JlctcChAMR3RLdnZJLas",

    "https://jumpshare.com/embed/4T6w3ZiyAm5wIhlUjo5C",

    "https://jumpshare.com/embed/dU2qQXCSYdzicZu90ekg"

];


/* =========================
   🎵 MP4 SHORT LIST

   নিজের MP4-এর নাম এখানে দাও
========================= */

const mp4Shorts = [

    "short1.mp4",
    "short2.mp4",
    "short3.mp4",
    "short4.mp4"

];


/* =========================
   CREATE SHORT OBJECT
========================= */

const shortVideos = [

    ...mp4Shorts.map(
        function(src){

            return {
                type:"file",
                src:src
            };

        }
    ),

    ...jumpshareShorts.map(
        function(src){

            return {
                type:"jumpshare",
                src:src
            };

        }
    )

];


/* =========================
   RANDOM FUNCTION
========================= */

function shuffle(array){

    for(
        let i=array.length-1;
        i>0;
        i--
    ){

        const j =
        Math.floor(
            Math.random()*(i+1)
        );

        [
            array[i],
            array[j]
        ] =
        [
            array[j],
            array[i]
        ];

    }

    return array;

}


/* =========================
   RANDOM FULL VIDEOS
========================= */

const randomFull =
shuffle(
    [...fullVideos]
);


/* =========================
   VIDEO FEED
========================= */

const feed =
document.getElementById(
    "videoFeed"
);


/* =========================
   CREATE FULL VIDEO
========================= */

function createFullVideo(src){

    const card =
    document.createElement("div");

    card.className =
    "video-card";


    card.innerHTML = `

        <video
            src="${src}"
            controls
            playsinline
            preload="metadata">
        </video>

    `;


    return card;

}


/* =========================
   CREATE SHORT ROW
========================= */

function createShortRow(){

    const section =
    document.createElement("div");

    section.className =
    "short-section";


    /* SHORT TITLE */

    const heading =
    document.createElement("div");

    heading.className =
    "short-heading";

    heading.innerHTML =
    "👉 🎵 Short Videos";


    section.appendChild(
        heading
    );


    /* SHORT HORIZONTAL LINE */

    const line =
    document.createElement("div");

    line.className =
    "tiktok-line";


    /*
       প্রতিবার নতুন random
       order
    */

    const rowShorts =
    shuffle(
        [...shortVideos]
    );


    /* CREATE EACH SHORT CARD */

    rowShorts.forEach(
        function(video){

            const card =
            document.createElement("div");

            card.className =
            "tiktok-card";


            /* MP4 SHORT */

            if(
                video.type === "file"
            ){

                card.innerHTML = `

                    <video
                        src="${video.src}"
                        muted
                        playsinline
                        loop
                        preload="metadata">
                    </video>

                `;

            }


            /* JUMPSHARE SHORT */

            if(
                video.type === "jumpshare"
            ){

                card.innerHTML = `

                    <iframe
                        src="${video.src}"
                        frameborder="0"
                        allow="
                        autoplay;
                        fullscreen;
                        picture-in-picture"
                        allowfullscreen>
                    </iframe>

                `;

            }


            /* OPEN SHORT VIEWER */

            card.onclick =
            function(){

                openShortViewer(
                    video
                );

            };


            line.appendChild(
                card
            );

        }
    );


    section.appendChild(
        line
    );


    return section;

}


/* =========================
   BUILD MAIN FEED

   প্রতি ৪টি Full Video-এর
   পরে Short Row
========================= */

randomFull.forEach(
    function(video,index){

        feed.appendChild(
            createFullVideo(
                video
            )
        );


        if(
            (index + 1) % 4 === 0
        ){

            feed.appendChild(
                createShortRow()
            );

        }

    }
);


/* =========================
   SHORT VIEWER VARIABLES
========================= */

const shortViewer =
document.getElementById(
    "shortViewer"
);

const shortFeed =
document.getElementById(
    "shortFeed"
);

const shortClose =
document.getElementById(
    "shortClose"
);

const soundButton =
document.getElementById(
    "soundButton"
);


/* SOUND STATUS */

let soundOn = false;


/* CURRENT SHORT LIST */

let currentVideos = [];


/* =========================
   OPEN SHORT VIEWER
========================= */

function openShortViewer(
    clickedVideo
){

    /*
       পুরোনো viewer পরিষ্কার
    */

    shortFeed.innerHTML = "";


    /*
       যেটায় চাপ দেওয়া হয়েছে
       সেটা প্রথমে
    */

    const others =
    shortVideos.filter(
        function(video){

            return video.src !==
                   clickedVideo.src;

        }
    );


    /*
       বাকিগুলো random
    */

    shuffle(
        others
    );


    /*
       clicked video + random videos
    */

    currentVideos = [

        clickedVideo,

        ...others

    ];


    /*
       Viewer তৈরি
    */

    createViewerVideos();


    /*
       Viewer দেখানো
    */

    shortViewer.classList.add(
        "active"
    );


    document.body.style.overflow =
    "hidden";


    /*
       Sound reset
    */

    soundOn = false;

    soundButton.innerHTML =
    "🔇";


    /*
       প্রথম MP4 চালানোর চেষ্টা
    */

    setTimeout(
        function(){

            playVisibleVideo();

        },
        100
    );

}


/* =========================
   CREATE VIEWER VIDEOS
========================= */

function createViewerVideos(){

    shortFeed.innerHTML = "";


    currentVideos.forEach(
        function(video){

            const item =
            document.createElement(
                "div"
            );

            item.className =
            "short-item";


            /* MP4 */

            if(
                video.type === "file"
            ){

                item.innerHTML = `

                    <video
                        src="${video.src}"
                        autoplay
                        muted
                        loop
                        playsinline
                        preload="auto">
                    </video>

                `;

            }


            /* JUMPSHARE */

            if(
                video.type === "jumpshare"
            ){

                item.innerHTML = `

                    <iframe
                        src="${video.src}"
                        frameborder="0"
                        allow="
                        autoplay;
                        fullscreen;
                        picture-in-picture"
                        allowfullscreen>
                    </iframe>

                `;

            }


            shortFeed.appendChild(
                item
            );

        }
    );

}


/* =========================
   FIND VISIBLE SHORT
========================= */

function playVisibleVideo(){

    const items =
    shortFeed.querySelectorAll(
        ".short-item"
    );


    let bestItem = null;

    let bestVisibility = 0;


    items.forEach(
        function(item){

            const rect =
            item.getBoundingClientRect();


            const visibleTop =
            Math.max(
                rect.top,
                0
            );


            const visibleBottom =
            Math.min(
                rect.bottom,
                window.innerHeight
            );


            const visible =
            Math.max(
                0,
                visibleBottom -
                visibleTop
            );


            if(
                visible >
                bestVisibility
            ){

                bestVisibility =
                visible;

                bestItem =
                item;

            }

        }
    );


    /*
       সব MP4 pause
    */

    items.forEach(
        function(item){

            const video =
            item.querySelector(
                "video"
            );


            if(!video){
                return;
            }


            if(
                item === bestItem
            ){

                video.muted =
                !soundOn;

                video.play().catch(
                    function(){}
                );

            }else{

                video.pause();

            }

        }
    );

}


/* =========================
   SCROLL
========================= */

let scrollTimer;


shortFeed.addEventListener(
    "scroll",
    function(){

        clearTimeout(
            scrollTimer
        );


        scrollTimer =
        setTimeout(
            function(){

                playVisibleVideo();


                /*
                   নিচের দিকে গেলে
                   আরো random Short যোগ
                */

                if(
                    shortFeed.scrollTop +
                    shortFeed.clientHeight >=
                    shortFeed.scrollHeight - 300
                ){

                    addMoreRandomShorts();

                }

            },
            80
        );

    }
);


/* =========================
   ADD MORE RANDOM SHORTS
========================= */

function addMoreRandomShorts(){

    /*
       নতুন random list
    */

    const more =
    shuffle(
        [...shortVideos]
    );


    more.forEach(
        function(video){

            const item =
            document.createElement(
                "div"
            );

            item.className =
            "short-item";


            /* MP4 */

            if(
                video.type === "file"
            ){

                item.innerHTML = `

                    <video
                        src="${video.src}"
                        muted
                        loop
                        playsinline
                        preload="auto">
                    </video>

                `;

            }


            /* JUMPSHARE */

            if(
                video.type === "jumpshare"
            ){

                item.innerHTML = `

                    <iframe
                        src="${video.src}"
                        frameborder="0"
                        allow="
                        autoplay;
                        fullscreen;
                        picture-in-picture"
                        allowfullscreen>
                    </iframe>

                `;

            }


            shortFeed.appendChild(
                item
            );

        }
    );
}
/* =========================
   🔊 VOLUME BUTTON
========================= */

soundButton.onclick =
function(event){
    event.stopPropagation();
    soundOn =
    !soundOn;
    const videos =
    shortFeed.querySelectorAll(
        "video"
    );
    videos.forEach(
        function(video){
            video.muted =
            !soundOn;
        }
    );
    playVisibleVideo();
    if(soundOn){

        soundButton.innerHTML =
        "🔊";
    }else{

        soundButton.innerHTML =
        "🔇";
    }

};

/* =========================
   CLOSE SHORT VIEWER
========================= */

shortClose.onclick =
function(){

    shortViewer.classList.remove(
        "active"
    );
    document.body.style.overflow =
    "";
    /*
       সব MP4 বন্ধ
    */
    shortFeed
        .querySelectorAll("video")
        .forEach(
            function(video){

                video.pause();
            }
        );
    shortFeed.innerHTML =
    "";
};
/* =========================
   ESC KEY
========================= */

document.addEventListener(
    "keydown",
    function(event){

        if(
            event.key === "Escape"
        ){
            if(
                shortViewer.classList
                .contains("active")
            ){

                shortClose.click();
            }
        }
    }
);

</script>
