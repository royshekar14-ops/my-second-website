 <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Duck Farm 🦆</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:linear-gradient(#87ceeb,#dff6ff);
    color:#222;
}

.topbar{
    display:flex;
    justify-content:space-around;
    align-items:center;
    background:#fff;
    padding:12px;
    position:sticky;
    top:0;
    z-index:10;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
}

.resource{
    font-size:18px;
    font-weight:bold;
}

.game{
    max-width:600px;
    margin:auto;
    padding:15px;
}

.house{
    margin-top:20px;
    min-height:280px;
    border:5px solid #8b4513;
    border-radius:25px;
    background:linear-gradient(#f4c27a,#d99a4e);
    position:relative;
    overflow:hidden;
    box-shadow:0 8px 20px rgba(0,0,0,.25);
}

.house h1{
    text-align:center;
    color:white;
    text-shadow:2px 2px #5a2d0c;
}

.ducks{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:15px;
    padding:20px;
}

.duck{
    background:white;
    border-radius:20px;
    padding:12px;
    text-align:center;
    width:140px;
    box-shadow:0 5px 12px rgba(0,0,0,.2);
}

.duck-img{
    width:100%;
    height:110px;
    display:flex;
    justify-content:center;
    align-items:center;
    margin-bottom:8px;
}

.duck-img img{
    width:100%;
    height:110px;
    object-fit:cover;
    border-radius:15px;
}

.level{
    font-weight:bold;
}

.buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
    margin-top:20px;
}

button{
    border:none;
    border-radius:15px;
    padding:15px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    background:#fff;
    box-shadow:0 4px 8px rgba(0,0,0,.18);
}

button:active{
    transform:scale(.96);
}

.panel{
    background:white;
    margin-top:20px;
    padding:18px;
    border-radius:20px;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
}

.panel h2{
    margin-top:0;
}

.collection{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:10px;
}

.card{
    background:#f5f5f5;
    padding:10px;
    border-radius:15px;
    text-align:center;
}

.card img{
    width:100%;
    height:120px;
    object-fit:cover;
    border-radius:12px;
    margin-bottom:5px;
}

.common{
    border:3px solid #999;
}

.uncommon{
    border:3px solid #35a853;
}

.rare{
    border:3px solid #4285f4;
}

.epic{
    border:3px solid #9c27b0;
}

.legendary{
    border:3px solid #ff9800;
}

.timer{
    font-size:30px;
    text-align:center;
    font-weight:bold;
    margin:15px;
}
